name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run standardrb
        run: bundle exec standardrb --no-fix --format progress

  test:
    name: "Tests - ${{ matrix.ruby }} | ${{ matrix.gemfile }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every cell is listed explicitly rather than built from a cross product
      # plus `exclude:`. An exclude row that names a gemfile which does not
      # exist is silently ignored, which is how this matrix previously ended up
      # with four dead rows for a "rails_7_0_graphiti_rails.gemfile" that was
      # never generated. An include row cannot fail that way - a bad gemfile
      # path fails the job loudly.
      #
      # Ruby coverage per Rails version tracks that version's own supported
      # range; see Appraisals for the matching sqlite3 constraints.
      matrix:
        include:
          # No Rails - the library on its own, across every supported Ruby
          - { ruby: "3.1", gemfile: Gemfile }
          - { ruby: "3.2", gemfile: Gemfile }
          - { ruby: "3.3", gemfile: Gemfile }
          - { ruby: "3.4", gemfile: Gemfile }
          - { ruby: "3.5", gemfile: Gemfile }

          # Rails 7.0 - EOL, floor + one modern Ruby only
          - { ruby: "3.1", gemfile: gemfiles/rails_7_0.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_0.gemfile }
          - { ruby: "3.1", gemfile: gemfiles/rails_7_0_graphiti_rails.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_0_graphiti_rails.gemfile }

          # Rails 7.1
          - { ruby: "3.1", gemfile: gemfiles/rails_7_1.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_7_1.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_7_1.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_1.gemfile }
          - { ruby: "3.1", gemfile: gemfiles/rails_7_1_graphiti_rails.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_7_1_graphiti_rails.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_7_1_graphiti_rails.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_1_graphiti_rails.gemfile }

          # Rails 7.2
          - { ruby: "3.1", gemfile: gemfiles/rails_7_2.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_7_2.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_7_2.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_2.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_7_2.gemfile }
          - { ruby: "3.1", gemfile: gemfiles/rails_7_2_graphiti_rails.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_7_2_graphiti_rails.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_7_2_graphiti_rails.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_7_2_graphiti_rails.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_7_2_graphiti_rails.gemfile }

          # Rails 8.0 - requires Ruby 3.2+
          - { ruby: "3.2", gemfile: gemfiles/rails_8_0.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_8_0.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_8_0.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_8_0.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_8_0_graphiti_rails.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_8_0_graphiti_rails.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_8_0_graphiti_rails.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_8_0_graphiti_rails.gemfile }

          # Rails 8.1 - requires Ruby 3.2+
          - { ruby: "3.2", gemfile: gemfiles/rails_8_1.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_8_1.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_8_1.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_8_1.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_8_1_graphiti_rails.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_8_1_graphiti_rails.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_8_1_graphiti_rails.gemfile }
          - { ruby: "3.5", gemfile: gemfiles/rails_8_1_graphiti_rails.gemfile }

          # Early warning for the next Ruby - never blocks the build
          - { ruby: ruby-head, gemfile: Gemfile }
          - { ruby: ruby-head, gemfile: gemfiles/rails_8_1.gemfile }
          - { ruby: ruby-head, gemfile: gemfiles/rails_8_1_graphiti_rails.gemfile }
    continue-on-error: ${{ matrix.ruby == 'ruby-head' }}
    env: # $BUNDLE_GEMFILE must be set at the job level, so it is set for all steps
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      # spec_helper.rb keys off this to load ActiveRecord/Rails and run the
      # integration specs. It follows directly from the gemfile, so it is
      # derived here rather than carried as its own matrix axis.
      - name: Set up Appraisal
        if: matrix.gemfile != 'Gemfile'
        run: echo "APPRAISAL_INITIALIZED=true" >> $GITHUB_ENV
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec

  publish:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - name: Dispatch Release
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Generate New Release
          token: ${{ secrets.GITHUB_TOKEN }}
