---
name: Generate New Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # semantic-release reads the tag history to work out the next version
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # semantic-release 25 and its plugins require ^22.22.2 || >=24.15
          node-version: "24"
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
        run: npx semantic-release
      # A release published with GITHUB_TOKEN never fires other workflows' release triggers, so the docs are rebuilt by hand.
      - name: Rebuild docs with the new version label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref "$GITHUB_REF_NAME"
